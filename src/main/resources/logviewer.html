<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>wallet · live logs</title>
<style>
  :root{--bg:#0d1117;--fg:#c9d1d9;--dim:#6e7681;--rule:#20262d;
        --ok:#56d364;--warn:#e3b341;--err:#f85149;--accent:#58b6c1;--key:#79c0ff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--rule);
         padding:12px 16px;display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
  h1{font-size:13px;margin:0;font-weight:600;letter-spacing:.02em}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--dim);display:inline-block;margin-right:6px}
  .dot.live{background:var(--ok);box-shadow:0 0 0 3px rgba(86,211,100,.15)}
  .meta{color:var(--dim);font-size:11.5px}
  .meta a{color:var(--accent)}
  main{padding:10px 16px 56px}
  .ln{padding:3px 0;border-bottom:1px solid rgba(255,255,255,.035);word-break:break-word}
  .ts{color:var(--dim)}
  .ev{color:var(--accent);font-weight:600}
  .ev.completed{color:var(--ok)} .ev.declined{color:var(--warn)}
  .ev.rejected{color:var(--warn)} .ev.replay{color:var(--key)}
  .lvl-ERROR .ev,.lvl-ERROR .msg{color:var(--err)}
  .cid{color:var(--dim)}
  .msg{color:var(--fg)}
  .empty{color:var(--dim);padding:20px 0}
  @media(prefers-color-scheme:light){
    :root{--bg:#fbfcfd;--fg:#1f2328;--dim:#6a737d;--rule:#d8dee4;--key:#0550ae;--accent:#0b5e68}
    .ln{border-bottom-color:rgba(0,0,0,.05)}
  }
</style>
<header>
  <h1><span class="dot" id="dot"></span>wallet · live logs</h1>
  <span class="meta" id="status">connecting…</span>
  <span class="meta">raw: <a href="/debug/logs?format=json">ndjson</a> ·
    <a href="/debug/logs/stream">sse</a> ·
    <a href="/admin/invariants">invariants</a></span>
</header>
<main id="out"><div class="empty">waiting for events…</div></main>
<script>
  const out = document.getElementById('out');
  const dot = document.getElementById('dot');
  const status = document.getElementById('status');
  let count = 0;

  function atBottom(){ return window.innerHeight + window.scrollY >= document.body.offsetHeight - 80; }

  function render(raw){
    let d; try { d = JSON.parse(raw); } catch { return; }
    if (count === 0) out.innerHTML = '';
    const stick = atBottom();
    const msg = d.message || '';
    const m = msg.match(/^event=([a-z_.]+)\s*(.*)$/);
    const name = m ? m[1] : null;
    const rest = m ? m[2] : msg;
    let kind = '';
    if (name) {
      if (name.includes('completed')) kind = 'completed';
      else if (name.includes('declined') || name.includes('rejected')) kind = 'declined';
      else if (name.includes('replay') || name.includes('conflict')) kind = 'replay';
    }
    const el = document.createElement('div');
    el.className = 'ln lvl-' + (d.level || 'INFO');
    const ts = (d.ts || '').replace('T',' ').replace(/\.\d+Z?$/,'');
    el.innerHTML =
      `<span class="ts">${ts}</span> ` +
      (name ? `<span class="ev ${kind}">${name}</span> ` : '') +
      `<span class="msg">${rest.replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}</span>` +
      (d.correlation_id ? ` <span class="cid">cid=${d.correlation_id}</span>` : '');
    out.appendChild(el);
    count++;
    if (out.children.length > 1500) out.removeChild(out.firstChild);
    if (stick) window.scrollTo(0, document.body.scrollHeight);
    status.textContent = count + ' events';
  }

  const es = new EventSource('/debug/logs/stream');
  es.onopen  = () => { dot.classList.add('live'); status.textContent = 'live'; };
  es.onerror = () => { dot.classList.remove('live'); status.textContent = 'reconnecting…'; };
  es.onmessage = e => render(e.data);
</script>
