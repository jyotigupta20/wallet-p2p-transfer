# Round-robin across both replicas so a local burst genuinely spreads.
upstream wallet_app {
    server app-1:8080 max_fails=0;
    server app-2:8080 max_fails=0;
}

server {
    listen 8000;

    location / {
        proxy_pass http://wallet_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Pass the caller's correlation id through untouched, or mint one so a
        # request is traceable across the balancer even if the client omitted it.
        proxy_set_header X-Request-Id      $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}
