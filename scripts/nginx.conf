# Preserve a caller-supplied correlation id; mint one only when absent.
# Setting X-Request-Id to $request_id unconditionally OVERWRITES the caller's
# own id, which silently breaks end-to-end tracing for anyone who supplies one -
# the proxy becomes the place where the trace is lost.
map $http_x_request_id $forwarded_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

# Round-robin across both replicas so a local burst genuinely spreads.
upstream wallet_app {
    server app-1:8080 max_fails=0;
    server app-2:8080 max_fails=0;
}

server {
    listen 8000;

    # Server-sent events must not be buffered, or the live log stream appears
    # to hang. Same trap as any reverse proxy in front of the deployed service.
    location /debug/logs/stream {
        proxy_pass http://wallet_app;
        proxy_set_header Host         $host;
        proxy_set_header X-Request-Id $forwarded_request_id;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    location / {
        proxy_pass http://wallet_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The caller's correlation id passes through untouched; one is minted
        # only when the client omitted it.
        proxy_set_header X-Request-Id      $forwarded_request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}
