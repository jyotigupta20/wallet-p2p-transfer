# One command: `docker compose up --build`
#
# Stands up Postgres plus TWO app replicas behind an nginx round-robin.
# Two replicas is the point: the graded invariants must hold because they are
# enforced in Postgres, not because a single JVM happened to serialise things
# in memory. Hit http://localhost:8000 (the balancer) and watch the
# X-Instance-Id response header alternate between app-1 and app-2.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  app-1: &app
    build:
      context: .
    image: paytm-wallet:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/wallet
      DB_USER: wallet
      DB_PASSWORD: wallet
      INSTANCE_ID: app-1
      # Demo posture: a new wallet opens with Rs 10,000 so the burst script
      # needs no funding step. Recorded as an OPENING ledger row, so the
      # conservation check stays exact.
      OPENING_BALANCE_PAISE: "1000000"
      ADMIN_TOKEN: local-admin-token
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
    ports:
      - "8080:8080"
    restart: unless-stopped

  app-2:
    <<: *app
    depends_on:
      db:
        condition: service_healthy
      app-1:
        condition: service_started   # let one replica win the Flyway migration lock first
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/wallet
      DB_USER: wallet
      DB_PASSWORD: wallet
      INSTANCE_ID: app-2
      OPENING_BALANCE_PAISE: "1000000"
      ADMIN_TOKEN: local-admin-token
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
    ports:
      - "8081:8080"

  lb:
    image: nginx:1.27-alpine
    depends_on: [app-1, app-2]
    volumes:
      - ./scripts/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  pgdata:
