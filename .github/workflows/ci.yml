name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  invariants:
    name: Prove the invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Testcontainers starts a real Postgres; the runner already has Docker.
      - name: Concurrency test suite
        run: mvn -B test

      - name: Build image (multi-stage, non-root, HEALTHCHECK)
        run: docker build -t paytm-wallet:ci .

      - name: Verify the container runs as non-root
        run: |
          uid=$(docker run --rm --entrypoint id paytm-wallet:ci -u)
          echo "container uid: $uid"
          test "$uid" = "10001"

      - name: End-to-end burst against the full compose stack
        run: |
          docker compose up -d --build
          for i in $(seq 1 90); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' paytm-wallet-app-1-1 2>/dev/null)" = "healthy" ] \
            && [ "$(docker inspect --format '{{.State.Health.Status}}' paytm-wallet-app-2-1 2>/dev/null)" = "healthy" ]; then
              echo "stack healthy after ${i}s"; break
            fi
            sleep 1
          done
          # Sprayed across both replicas: correctness must come from Postgres,
          # not from one JVM happening to serialise things in memory.
          ./burst.sh http://localhost:8080 http://localhost:8081 --transfers 400 --contended-wallets 3

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --tail=200
